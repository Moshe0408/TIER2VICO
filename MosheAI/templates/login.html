<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MosheAI — כניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #080b12;
  --card: #0f1420;
  --border: #1e2a40;
  --p1: #7c3aed;
  --blue: #2563eb;
  --text: #e2e8f0;
  --muted: #8b99b5;
  --dim: #4b5673;
  --glow: rgba(124,58,237,0.4);
  --red: rgba(220,38,38,0.15);
  --red-b: rgba(220,38,38,0.4);
}
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  direction: rtl;
}

/* Background grid */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

/* Glow orbs */
body::after {
  content: "";
  position: fixed;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  padding: 16px;
}

.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px;
  box-shadow: 0 8px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,58,237,0.1);
}

/* Logo */
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--p1), var(--blue));
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin-bottom: 16px;
  box-shadow: 0 0 32px var(--glow);
  animation: float 3s ease-in-out infinite;
}
.login-logo-title {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(90deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-logo-sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

/* Form */
.form-group {
  margin-bottom: 18px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input[type="text"],
input[type="password"] {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  direction: ltr;
  text-align: right;
}
input:focus {
  border-color: var(--p1);
  box-shadow: 0 0 0 3px rgba(124,58,237,0.25);
}

.login-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--p1), var(--blue));
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}
.login-btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
}
.login-btn:hover { transform: translateY(-1px); opacity: 0.92; }
.login-btn:active { transform: translateY(0); }

.error-msg {
  background: var(--red);
  border: 1px solid var(--red-b);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  color: #fca5a5;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.powered-by {
  text-align: center;
  font-size: 11px;
  color: var(--dim);
  margin-top: 24px;
}
.powered-by span {
  color: #a78bfa;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🤖</div>
      <div class="login-logo-title">MosheAI</div>
      <div class="login-logo-sub">עוזר חכם לדוחות, שקופיות וסטטיסטיקה</div>
    </div>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>שם משתמש</label>
        <input type="text" name="username" placeholder="הכנס שם משתמש" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label>סיסמה</label>
        <input type="password" name="password" placeholder="הכנס סיסמה" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">כניסה למערכת ←</button>
    </form>

    <div class="powered-by">מופעל על ידי <span>Claude claude-opus-4-6</span> · Anthropic</div>
  </div>
</div>
</body>
</html>
